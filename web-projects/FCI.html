<main class="fci-main">
    <section aria-labelledby="inventory-heading">
        <h2 id="inventory-heading">Force Concept Inventory</h2>
        <form id="fci-form">
            <div id="fci-question"></div>
            <p id="fci-error" class="fci-error" role="alert" hidden></p>
            <div class="fci-controls">
                <button id="fci-previous" type="button">Previous</button>
                <button id="fci-next" type="button">Next</button>
                <button id="fci-submit" type="submit" hidden>Submit test</button>
            </div>
        </form>
        <div id="fci-result" class="fci-result" role="status" aria-live="polite" hidden>
            <p id="fci-score"></p>
            <button id="fci-restart" type="button">Take the test again</button>
        </div>
        <noscript>This test needs JavaScript enabled to display the answer form and calculate your score.</noscript>
    </section>
</main>

<footer>
    <p>2026 Daniel Chui | Graduate Student Portfolio</p>
</footer>
